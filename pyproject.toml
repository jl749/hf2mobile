[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hf2mobile"
version = "0.1.0"
description = "Export/optimize HuggingFace torch models for mobile deployment (supports ONNXRuntime - CPUEP/QNNEP)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "jlee" }]
license = { text = "MIT" }
keywords = ["onnx", "transformers", "huggingface", "quantization", "onnxruntime", "qnn"]

dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "numpy>=2.0",
    "onnx>=1.18",
    "onnx-ir>=0.2",
    "onnxscript>=0.7",
    "onnxruntime>=1.22",
]

[project.scripts]
hf2mobile-export = "hf2mobile.export:main"

# ---------------------------------------------------------------------------
# maturin: mixed Rust/Python project.
#   - python-source = "src"  -> the `hf2mobile` package lives under src/
#   - module-name            -> the Rust cdylib is installed as `hf2mobile._ortrs_binding`
# The Rust crate (Cargo.toml at the repo root) has its sources in src/ort_inferencer.
# ---------------------------------------------------------------------------
[tool.maturin]
python-source = "src"
module-name = "hf2mobile._ortrs_binding"
features = ["pyo3/extension-module"]

# ---------------------------------------------------------------------------
# uv: resolve torch from the CPU wheel index for reproducible CPU installs.
# Drop this section (and use the default index) if you want CUDA wheels.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8", "build>=1.2", "pre-commit>=3.7"]
