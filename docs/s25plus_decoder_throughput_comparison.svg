<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Decode throughput versus model size on a Galaxy S25+. W4A8 on the NPU is fastest at every size, from 59.5 tokens per second at 0.6B down to 17.5 at 4B. CPU fp32 reaches 24.8 at 0.6B and 9.0 at 1.7B, and does not fit past that.">
  <style>
    .surface { fill: #fcfcfb; }
    .ink     { fill: #0b0b0b; }
    .ink2    { fill: #52514e; }
    .grid    { stroke: #e4e3df; stroke-width: 1; }
    .axis    { stroke: #c9c8c3; stroke-width: 1; }
    .ring    { stroke: #fcfcfb; stroke-width: 2; }
    .s1 { stroke: #2a78d6; fill: #2a78d6; }
    .s2 { stroke: #eb6834; fill: #eb6834; }
    .s3 { stroke: #1baf7a; fill: #1baf7a; }
    .s4 { stroke: #eda100; fill: #eda100; }
    .s5 { stroke: #e87ba4; fill: #e87ba4; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink     { fill: #ffffff; }
      .ink2    { fill: #c3c2b7; }
      .grid    { stroke: #34332f; }
      .axis    { stroke: #4a4945; }
      .ring    { stroke: #1a1a19; }
      .s1 { stroke: #3987e5; fill: #3987e5; }
      .s2 { stroke: #d95926; fill: #d95926; }
      .s3 { stroke: #199e70; fill: #199e70; }
      .s4 { stroke: #c98500; fill: #c98500; }
      .s5 { stroke: #d55181; fill: #d55181; }
    }
    .line  { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dash  { stroke-dasharray: 7 5; }
    .mark  { stroke-width: 2; }
    .t-title { font-size: 15px; font-weight: 600; }
    .t-sub   { font-size: 12px; }
    .t-ax    { font-size: 12px; }
    .t-lab   { font-size: 11px; font-weight: 600; }
    .t-leg   { font-size: 12px; }
  </style>

  <rect class="surface" x="0" y="0" width="760" height="470"/>

  <text class="ink t-title" x="24" y="30">Decode throughput vs model size — Galaxy S25+ (HTP v79)</text>
  <text class="ink2 t-sub" x="24" y="50">tokens/sec, higher is better. Burst mode, 1-token prompt, 32 generated tokens.</text>

  <!-- plot area: x 74..596, y 78..362 ; y 0..64 tok/s ; x 0.4..4.3 B params -->
  <g class="grid">
    <line x1="74" y1="362" x2="596" y2="362"/>
    <line x1="74" y1="291" x2="596" y2="291"/>
    <line x1="74" y1="220" x2="596" y2="220"/>
    <line x1="74" y1="149" x2="596" y2="149"/>
    <line x1="74" y1="78"  x2="596" y2="78"/>
  </g>
  <g class="ink2 t-ax" text-anchor="end">
    <text x="62" y="366">0</text>
    <text x="62" y="295">16</text>
    <text x="62" y="224">32</text>
    <text x="62" y="153">48</text>
    <text x="62" y="82">64</text>
  </g>
  <text class="ink2 t-ax" transform="translate(22,220) rotate(-90)" text-anchor="middle">tokens / sec</text>
  <line class="axis" x1="74" y1="78" x2="74" y2="362"/>

  <!-- x ticks at 0.6, 1.7, 3.0, 4.0 B  ->  x = 74 + (p-0.4)/3.9*522 -->
  <g class="ink2 t-ax" text-anchor="middle">
    <text x="101" y="386">0.6B</text>
    <text x="248" y="386">1.7B</text>
    <text x="422" y="386">3B</text>
    <text x="556" y="386">4B</text>
    <text x="335" y="410" class="ink2">model size (parameters)</text>
  </g>

  <!-- ── NPU W4A16 (slot 2, square) — drawn first; W4A8 is 1-3% above it and would
       otherwise be hidden underneath where the two nearly coincide ── -->
  <polyline class="line s2" points="101,101 248,232 422,265 556,285"/>
  <g class="mark ring">
    <rect class="s2" x="96"  y="96"  width="10" height="10" rx="1.5"/>
    <rect class="s2" x="243" y="227" width="10" height="10" rx="1.5"/>
    <rect class="s2" x="417" y="260" width="10" height="10" rx="1.5"/>
    <rect class="s2" x="551" y="280" width="10" height="10" rx="1.5"/>
  </g>

  <!-- ── NPU W4A8 (slot 1, circle) ── -->
  <polyline class="line s1" points="101,98 248,228 422,263 556,285"/>
  <g class="mark ring">
    <circle class="s1" cx="101" cy="98"  r="5.5"/>
    <circle class="s1" cx="248" cy="228" r="5.5"/>
    <circle class="s1" cx="422" cy="263" r="5.5"/>
    <circle class="s1" cx="556" cy="285" r="5.5"/>
  </g>
  <text class="ink t-lab" x="101" y="86"  text-anchor="middle">59.5</text>
  <text class="ink t-lab" x="556" y="273" text-anchor="middle">17.5</text>

  <!-- ── NPU W8A8 (slot 3, triangle) ── -->
  <polyline class="line s3" points="101,135 248,267 422,293 556,315"/>
  <g class="mark ring">
    <path class="s3" d="M101,129 l6.5,11 h-13 z"/>
    <path class="s3" d="M248,261 l6.5,11 h-13 z"/>
    <path class="s3" d="M422,287 l6.5,11 h-13 z"/>
    <path class="s3" d="M556,309 l6.5,11 h-13 z"/>
  </g>
  <text class="ink t-lab" x="101" y="126" text-anchor="middle">51.2</text>

  <!-- ── NPU fp16 (slot 4, diamond) — no 4B point: 6.8 GB context set reboots the phone ── -->
  <polyline class="line s4" points="101,190 248,293 422,325"/>
  <g class="mark ring">
    <path class="s4" d="M101,183 l7,7 -7,7 -7,-7 z"/>
    <path class="s4" d="M248,286 l7,7 -7,7 -7,-7 z"/>
    <path class="s4" d="M422,318 l7,7 -7,7 -7,-7 z"/>
  </g>

  <!-- ── CPU fp32 (slot 5, cross, dashed) — no 3B/4B point: exceeds device RAM ── -->
  <polyline class="line dash s5" points="101,252 248,322"/>
  <g class="mark ring" stroke-linecap="round">
    <path class="s5" d="M95,246 l12,12 M107,246 l-12,12"/>
    <path class="s5" d="M242,316 l12,12 M254,316 l-12,12"/>
  </g>
  <text class="ink t-lab" x="101" y="243" text-anchor="middle">24.8</text>

  <!-- annotations for the two truncations -->
  <text class="ink2 t-ax" x="470" y="341" >fp16 ✕ at 4B</text>
  <text class="ink2 t-ax" x="272" y="336" >CPU ✕ past 1.7B</text>

  <!-- ── legend ── -->
  <g transform="translate(614,96)">
    <g class="mark ring"><circle class="s1" cx="8" cy="0" r="5.5"/></g>
    <text class="ink t-leg" x="24" y="4">NPU W4A8</text>

    <g class="mark ring"><rect class="s2" x="3" y="27" width="10" height="10" rx="1.5"/></g>
    <text class="ink t-leg" x="24" y="36">NPU W4A16</text>

    <g class="mark ring"><path class="s3" d="M8,58 l6.5,11 h-13 z"/></g>
    <text class="ink t-leg" x="24" y="68">NPU W8A8</text>

    <g class="mark ring"><path class="s4" d="M8,89 l7,7 -7,7 -7,-7 z"/></g>
    <text class="ink t-leg" x="24" y="100">NPU fp16</text>

    <g class="mark ring" stroke-linecap="round"><path class="s5" d="M2,122 l12,12 M14,122 l-12,12"/></g>
    <text class="ink t-leg" x="24" y="132">CPU fp32</text>
    <text class="ink2 t-leg" x="24" y="148" font-size="10.5">(dashed)</text>
  </g>

  <text class="ink2 t-ax" x="24" y="443">W4 / W8 = int4 / int8 weights, symmetric, per-row (one scale per output row) · A8 / A16 = uint8 / uint16 activations, asymmetric, per-tensor</text>
  <text class="ink2 t-ax" x="24" y="459">Missing points are configurations that do not fit on the device, not slow ones.</text>
</svg>
